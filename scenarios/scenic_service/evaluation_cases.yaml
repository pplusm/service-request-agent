# 这是验证本仓库演示安全规则的可复现基线，不是真实景区数据，也不能用于宣称准确率。
# 文本案例共 80 条：28 条正常、15 条缺少字段、15 条高风险、10 条知识未覆盖、
# 10 条对抗输入、2 条模型故障路径。另有 4 条使用合成无人物 PNG 的图文流程案例。
# 图文案例中的 vision_behavior 是预先声明的确定性模拟观察，用于验证流程，不是像素识别结果。
