[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-request-agent"
version = "0.1.0"
description = "Scenic-service request triage and handling demo"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.5,<2.0",
    "fastapi>=0.115,<1.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
    "PyYAML>=6.0,<7.0",
    "streamlit>=1.39,<2.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]
local-vision = [
    # CUDA 版 PyTorch 需从 PyTorch 官方索引单独安装，不能在这里固定为 CPU 包。
    "accelerate>=1.12,<2.0",
    "bitsandbytes>=0.49,<0.50",
    "Pillow>=10.0,<13.0",
    "transformers>=4.57,<4.58",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "scenarios*", "tests*", "docs*"]
namespaces = false
